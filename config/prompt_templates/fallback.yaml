# Fallback templates（检索兜底模板）
# 同时包含固定回复模板与模型兜底提示词模板。
# 固定回复：fallback_strategy = "fixed" 时直接作为回复返回给用户（不经过模型，因此不放语言规则占位符）
# 模型提示词：fallback_strategy = "model" 时作为发给大模型的提示词
templates:
  # --- 固定回复模板 ---
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
    default: true
    content: |
      抱歉，我没有在知识库中找到与您的问题直接相关的内容。

      您可以尝试：
      1. 换一种方式重新描述问题
      2. 提供更具体的信息
      3. 咨询相关领域的专业人士

      如果您还有其他问题，我很乐意继续为您解答。

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
    content: |
      很抱歉，我暂时无法准确地回答您的问题。可能的原因是：
      - 问题超出了我的知识范围
      - 知识库中还没有收录相关内容

      建议：
      1. 尝试换一组关键词重新提问
      2. 把问题拆分成更具体的小问题
      3. 联系客服人员获取帮助

      感谢您的理解，期待继续为您解答其他问题！

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
    content: "抱歉，我暂时无法回答这个问题。请尝试换一种问法，或联系客服获取帮助。"

  # --- 模型兜底提示词模板（fallback_strategy = "model" 时使用） ---
  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
    mode: "model"
    content: |
      检索没有得到与用户问题直接匹配的内容。知识库中现有以下文档：

      {{kb_documents}}

      重要说明：
      1. 如果上方文档列表可用，请借助它回答用户的问题（如列出相关文档、建议用户查阅哪些文档）
      2. 如果文档列表为空，请运用通识知识作答，并明确告知用户该答案并非来自知识库
      3. 涉及专业领域或需要最新信息的问题，建议用户查阅官方渠道
      4. 回答保持准确、客观

      ## 重要：语言规则
      - 始终使用{{language}}回答

      用户问题：{{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
    mode: "model"
    content: |
      你是知枢，一款专业友好的智能助手。

      检索没有得到与用户问题直接匹配的内容。知识库中现有以下文档：

      {{kb_documents}}

      ## 回答要求
      - 如果上方文档列表可用，请借助它回答用户的问题（如列出相关文档、建议用户查阅哪些文档，或概述知识库中现有的内容）
      - 如果文档列表为空或与问题无关，请基于通识知识回答，并明确告知用户该答案并非来自知识库
      - 回答简明、清晰、有实质内容
      - 涉及实时数据或个人隐私信息时，如实说明无法获取
      - 语气礼貌、专业
      - 注意：请始终使用{{language}}回答

      ## 用户问题：
      {{query}}
